name: Build Windows EXE

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python 3.13 installieren
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"

      - name: Abhängigkeiten installieren
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: EXE bauen
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm SchlauWutzie_V20_FINAL.spec
          if (!(Test-Path "dist\SchlauWutzie_V20_FINAL.exe")) {
            throw "EXE wurde nicht erzeugt."
          }

      - name: EXE als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: SchlauWutzie_V20_FINAL
          path: dist/SchlauWutzie_V20_FINAL.exe
          if-no-files-found: error
